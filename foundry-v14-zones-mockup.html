<!--
PROJECT: ANIME · FOUNDRY V14 MOCKUP
CHANGE SET: Zones on the scene canvas

TARGET
- Foundry VTT v14. A Zone is one core Region document carrying one system
  RegionBehavior of type "project-anime.zone".
- Zone name = the Region document's name. Shapes, holes, elevation, and the
  on-canvas editing handles are core Region features, used unchanged.
- V14 notes: Measured Templates are removed and folded into Regions. Regions
  gain Ring and Emanation shapes, resize/rotate/drag handles (circle = drag,
  square = resize, triangle = rotate), and can attach to a token and move with
  it. The Placeables sidebar tab lists Regions per scene. The system adds only
  the Zone behavior and its presentation, nothing core is re-implemented.

DATA MODEL
- RegionBehavior "project-anime.zone", system data:
  - effects: array of { keyword, name, text }
    - keyword: Defensive | Elevated | Energizing | Harmful | Hindering |
      Obscured | Restorative | Tight | Unstable | Volatile
    - name: the skin, e.g. "Tower Deck"
    - text: one concrete sentence in defined game terms
  - tint: color string, defaults drawn from the Rank palette
  - showPlate: boolean, default true
- No automation. Effects are text. Nothing rolls or applies itself.

MODES (toggle, top right of the mock)
- Storyteller: region handles and vertices, region sub-tools, the Zone
  behavior sheet.
- Player: fills and plates only. No handles, no tools, no sheet.

INTERACTIONS
- Click a plate or a zone shape: posts that Zone's card to chat. Any client.
  Wired in the mock.
- Hover a zone shape: fill brightens.
- Zone behavior sheet: keyword select, name, and text per row; add and remove
  rows; tint swatches; Show Plate toggle. Edits update plates and future cards.
- Token drag across a Zone border: the ruler renders beni past the border with
  a diamond at each crossing. Display only, no prompt.
- Zone membership from tokenEnter and tokenExit, kept as a display flag only.
- Plates and fills render for every client from the Region shapes, independent
  of the core region visibility setting.

EXAMPLE DATA (V3 doc, the crab army beach)
- Shoreline: Hindering (Deep Sand)
- Food Stands: Defensive (Overturned Stalls), Restorative (Snack Supplies)
- Lifeguard Tower: Elevated (Tower Deck), Unstable (Creaking Frame)
- Tokens: Kaito, The Crab Army, Crab King. Tension 2 of 6.

DESIGN NOTES
- Tokens: ink #221a36, paper #f7f2e7, paper-2 #ece4d1, beni #d92b48,
  gold #d9a13b. Zone tints here: C blue, D green, A orange.
- Fonts: Shippori Mincho B1 (display), Zen Kaku Gothic New (UI).
- Plate: ink, 6px beni spine with paper hairline, display-face name, keyword
  chips. Sheet and card follow the shared chrome. Other HUD elements omitted
  except a Tension meter placeholder.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project: Anime · Zones Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#221a36; --paper:#f7f2e7; --paper2:#ece4d1; --beni:#d92b48; --gold:#d9a13b;
  --rankE:#8a8fa0; --rankD:#3ba55d; --rankC:#3c78d8; --rankB:#7d5cd6; --rankA:#e2632e;
  --app:#181a21; --app2:#20222b; --line:#343640;
  --disp:'Shippori Mincho B1',serif; --ui:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--paper);font-family:var(--ui);overflow:hidden}
#app{display:grid;grid-template-columns:58px 1fr 324px;height:100vh}

/* ---------- scene controls rail ---------- */
#rail{background:var(--app2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:8px}
.railbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:5px;background:transparent;color:#8d92a1;font-size:17px;line-height:36px;text-align:center;cursor:pointer}
.railbtn.active{border-color:var(--beni);color:var(--paper);background:#2a2330;box-shadow:inset 0 0 0 1px var(--beni)}
.subtools{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.subtools .railbtn{width:32px;height:32px;font-size:14px;line-height:30px}

/* ---------- canvas ---------- */
#stage{position:relative;overflow:hidden;background:#e6d8b6}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

.zoneShape{stroke-width:2.5;stroke-dasharray:7 5;fill-opacity:.13;transition:fill-opacity .15s;cursor:pointer}
.zoneShape:hover{fill-opacity:.27}
.plate{cursor:pointer}
.plate .platebg{filter:drop-shadow(3px 3px 0 rgba(34,26,54,.45))}
.plate:hover .platebg{filter:drop-shadow(3px 3px 0 rgba(217,43,72,.55))}
.chip-t{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:1.5px;fill:var(--gold)}
.plname{font-family:var(--disp);font-weight:700;letter-spacing:1px;fill:var(--paper)}
.tokname{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:1.2px;fill:var(--paper)}
.mono{font-family:var(--disp);font-weight:800;fill:var(--ink)}
.st-only{display:initial}
body.player .st-only{display:none}

/* ---------- tension meter ---------- */
#tension{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid #3a3152;border-radius:5px;padding:6px 14px;display:flex;align-items:center;gap:10px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
#tension .lbl{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--gold)}
#tension .pip{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--paper);opacity:.45}
#tension .pip.on{background:var(--beni);border-color:var(--beni);opacity:1}

/* ---------- mode toggle ---------- */
#modes{position:absolute;top:10px;right:14px;display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
#modes button{border:0;background:var(--app2);color:#9aa0ae;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:1.5px;padding:7px 12px;cursor:pointer}
#modes button.on{background:var(--beni);color:var(--paper)}

/* ---------- zone behavior sheet ---------- */
#sheet{position:absolute;left:22px;bottom:22px;width:434px;border:1px solid #3a3d48;border-radius:6px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.5)}
#sheet .win{background:var(--app2);display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
#sheet .win .t{flex:1;font-size:12px;font-weight:700;letter-spacing:.6px;color:#c8ccd8}
#sheet .win .ic{color:#8d92a1;font-size:12px;cursor:pointer}
#sheet .body{background:var(--paper);color:var(--ink);padding:0 0 12px}
.obi{position:relative;background:var(--ink);color:var(--paper);padding:12px 14px 12px 24px;border-left:10px solid var(--beni);box-shadow:inset 2px 0 0 var(--paper);background-image:radial-gradient(rgba(247,242,231,.14) 1.1px,transparent 1.2px);background-size:9px 9px;display:flex;align-items:center}
.obi .zn{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:1.5px;flex:1}
.obi .tintdot{width:16px;height:16px;border-radius:50%;background:var(--rankA);box-shadow:0 0 0 2px var(--paper)}
.sec{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--ink);opacity:.75;padding:12px 16px 6px}
.fx{margin:0 14px 10px;border:2px solid var(--ink);background:var(--paper2);box-shadow:3px 3px 0 var(--ink)}
.fx .r1{display:grid;grid-template-columns:118px 1fr 26px;gap:0;border-bottom:1px solid var(--ink)}
.fx select{border:0;border-right:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:1px;padding:6px 8px}
.fx input{border:0;background:transparent;font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--ink);padding:6px 9px;min-width:0}
.fx .del{border:0;background:transparent;color:var(--beni);font-weight:700;cursor:pointer}
.fx textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-family:var(--ui);font-size:12.5px;color:#3a3050;padding:7px 9px;height:34px}
.addfx{margin:2px 14px 4px;border:0;background:var(--beni);color:var(--paper);font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:2px;padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.foot{display:flex;align-items:center;gap:14px;padding:12px 16px 0}
.foot label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink)}
.foot input[type=checkbox]{accent-color:var(--beni)}
.tints{display:flex;align-items:center;gap:7px;margin-left:auto}
.tints .tl{font-size:10px;font-weight:700;letter-spacing:2px;opacity:.7}
.tints .d{width:14px;height:14px;border-radius:50%;cursor:pointer}
.tints .d.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

/* ---------- chat ---------- */
#chat{background:#14151b;border-left:1px solid var(--line);display:flex;flex-direction:column}
#chat .hd{padding:12px 14px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:3px;color:var(--paper);border-bottom:2px solid var(--beni)}
#log{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px}
.msg .who{font-size:10.5px;letter-spacing:1px;color:#8d92a1;margin:0 2px 4px}
.zcard{background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;color:var(--ink)}
.zcard .obi{padding:8px 12px 8px 18px;border-left-width:6px}
.zcard .obi .zn{font-size:15px}
.zcard .fxl{padding:8px 12px;font-size:12px;line-height:1.45;border-top:1px solid var(--paper2)}
.zcard .fxl:first-of-type{border-top:0}
.zcard .kw{font-weight:700;letter-spacing:1px;font-size:10.5px;color:var(--beni)}
.zcard .skin{font-family:var(--disp);font-weight:700}
</style>
</head>

        <button class="addfx">+ ADD EFFECT</button>
        <div class="foot">
          <label><input type="checkbox" checked> Show plate on the scene</label>
          <div class="tints">
            <span class="tl">TINT</span>
            <span class="d" style="background:#3c78d8"></span>
            <span class="d" style="background:#3ba55d"></span>
            <span class="d" style="background:#7d5cd6"></span>
            <span class="d sel" style="background:#e2632e"></span>
            <span class="d" style="background:#8a8fa0"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- chat -->
  <div id="chat">
    <div class="hd">CHAT LOG</div>
    <div id="log"></div>
  </div>
</div>

<script>
const ZONES = {
  shoreline: { name:'SHORELINE', effects:[
    ['HINDERING','Deep Sand','Crossing out of the Shoreline is always under threat.']
  ]},
  foodstands: { name:'FOOD STANDS', effects:[
    ['DEFENSIVE','Overturned Stalls','You cannot be harmed from another Zone.'],
    ['RESTORATIVE','Snack Supplies','Spend the Spotlight here to recover 1 Energy.']
  ]},
  tower: { name:'LIFEGUARD TOWER', effects:[
    ['ELEVATED','Tower Deck','You can act against any Zone from here.'],
    ['UNSTABLE','Creaking Frame','A Fumble here drops you to the Shoreline.']
  ]}
};

function postZoneCard(id){
  const z = ZONES[id]; if(!z) return;
  const log = document.getElementById('log');
  const msg = document.createElement('div');
  msg.className = 'msg';
  const lines = z.effects.map(e =>
    '<div class="fxl"><span class="kw">'+e[0]+'</span> &middot; <span class="skin">'+e[1]+'.</span> '+e[2]+'</div>'
  ).join('');
  msg.innerHTML =
    '<div class="who">Storyteller</div>'+
    '<div class="zcard"><div class="obi"><span class="zn">'+z.name+'</span></div>'+lines+'</div>';
  log.appendChild(msg);
  log.scrollTop = log.scrollHeight;
}

document.querySelectorAll('.plate, .zoneShape').forEach(p =>
  p.addEventListener('click', () => postZoneCard(p.dataset.zone))
);

const mSt = document.getElementById('mSt'), mPl = document.getElementById('mPl');
mSt.addEventListener('click', () => { document.body.className='storyteller'; mSt.classList.add('on'); mPl.classList.remove('on'); });
mPl.addEventListener('click', () => { document.body.className='player'; mPl.classList.add('on'); mSt.classList.remove('on'); });

postZoneCard('foodstands');
</script>
</body>
</html>
